<!DOCTYPE html>
<html>

<head>
    <title>Notes Application</title>
    <meta charset="utf-8">
</head>

<body>
<h1>Notes</h1>
<h2>Create new note</h2>
<span th:text="${message}"></span>
<form action="#" th:action="@{/ui/notes}" th:object="${newNote}" method="POST">
    <label>Note</label>
    <input type="text" th:field="*{note}" />
    <label>Tag</label>
    <input type="text" th:field="*{tag}" />
    <button type="submit">Create note</button>
</form>
<h2>List</h2>
<table>
    <thead>
    <tr>
        <th>Id</th>
        <th>Note</th>
        <th>Tag</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="note: ${notes}">
        <td th:text="${note.id}"></td>
        <td th:text="${note.note}"></td>
        <td th:text="${note.tag}"></td>
        <td>
            <form th:action="@{/ui/notes/{id}(id=${note.id})}" method="POST">
                <input name="_method" type="hidden" value="DELETE" />
                <button type="submit">🗑️</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>

</html>
