# ===================================
# SPRING BOOT TEMPLATE - APPLICATION CONFIGURATION
# ===================================
# This file contains configuration for all Spring Boot examples in this template.
# Each section is labeled with which example(s) use these properties.

# ===================================
# SERVER CONFIGURATION
# ===================================
# Port on which the embedded Tomcat server will run
# Default: 8080
server.port=8080

# ===================================
# APPLICATION METADATA
# ===================================
# Application name - shown in Spring Boot Actuator and logs
spring.application.name=springtemplate

# ===================================
# ACTIVE PROFILES
# ===================================
# Spring profiles allow environment-specific configuration (dev, test, prod)
# Used by: All examples
# Uncomment to activate a specific profile:
spring.profiles.active=dev

# For production:
# spring.profiles.active=prod

# ===================================
# CONFIGURATION EXAMPLES (config/)
# ===================================
# These properties demonstrate Spring Boot configuration injection

# Example 1A: Simple @Value injection
# Used by: ConfigurableController1A.java
# Shows how to inject properties using @Value annotation
#controller.message=Hello World
controller.othermessage=Hello HS-KL
controller.log=Responding to a call of /example

# Example 1D: Environment variable with default value
# Used by: Configuration examples
# Syntax: ${ENV_VAR_NAME:default_value}
# This will use CONTROLLER_MESSAGE environment variable if set, otherwise "Hello World"
controller.message=${CONTROLLER_MESSAGE:Hello World}

# Example 1B: @ConfigurationProperties
# Used by: ConfigurableController1B.java and Controller1BConfig.java
# Demonstrates type-safe configuration binding
# (Add additional properties here as needed)

# ===================================
# DATA1 EXAMPLE - MONGODB (data1/)
# ===================================
# MongoDB connection string for NoSQL persistence example
# Format: mongodb://username:password@host:port/database?options
# Used by: MongoNoteRepository, NoteService, NoteController in data1 package
# 
# Prerequisites: Docker container or MongoDB server running
# Start MongoDB: docker run -d -p 27017:27017 -e MONGO_INITDB_ROOT_USERNAME=root -e MONGO_INITDB_ROOT_PASSWORD=local mongo
spring.data.mongodb.uri=mongodb://root:local@localhost:27017/data?authSource=admin&authMechanism=SCRAM-SHA-1

# ===================================
# DATA2 EXAMPLE - POSTGRESQL/JPA (data2/)
# ===================================
# PostgreSQL database connection for SQL persistence example
# Used by: NoteRepository, NoteEntity, NoteService in data2 package
# Also used by: Security examples (data2Security1, data2Security2)
#
# Prerequisites: Docker container or PostgreSQL server running
# Start PostgreSQL: docker run -d -p 5433:5432 -e POSTGRES_PASSWORD=local postgres

# JDBC connection URL
# Format: jdbc:postgresql://host:port/database
spring.datasource.url=jdbc:postgresql://localhost:5433/postgres

# Database credentials
spring.datasource.username=postgres
spring.datasource.password=local

# JDBC driver class (required for Thymeleaf auto-configuration)
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate configuration
# ddl-auto options:
#   - none: No schema management
#   - validate: Validate schema, make no changes
#   - update: Update schema if needed (use in development)
#   - create: Create schema, destroying previous data
#   - create-drop: Create schema, drop on shutdown
spring.jpa.hibernate.ddl-auto=update

# ===================================
# THYMELEAF/UI CONFIGURATION (data2/)
# ===================================
# Enable hidden HTTP method filter to support PUT/DELETE from HTML forms
# Required by: UIController.java in data2 example
# Allows using <input type="hidden" name="_method" value="PUT"> in Thymeleaf forms
spring.mvc.hiddenmethod.filter.enabled=true

# ===================================
# POKEMON API EXAMPLE (poke/)
# ===================================
# External API URL for Pokemon data
# Used by: PokeClientService.java
# Demonstrates RestTemplate usage and external API integration
pokeapi.pokemon.url=https://pokeapi.co/api/v2/pokemon

# ===================================
# SECURITY CONFIGURATION
# ===================================
# Security examples (data2Security1, data2Security2) use Spring Security defaults
# Custom security configuration is in:
#   - data2Security1/... (basic security)
#   - data2Security2/security/WebSecurityConfig.java (advanced)

# ===================================
# LOGGING CONFIGURATION (Optional)
# ===================================
# Uncomment to adjust logging levels for debugging
# logging.level.root=INFO
# logging.level.com.github.mohamad4444.springtemplate=DEBUG
# logging.level.org.springframework.web=DEBUG
# logging.level.org.hibernate.SQL=DEBUG

# ===================================
# ACTUATOR CONFIGURATION (Optional)
# ===================================
# Spring Boot Actuator provides production-ready features
# Uncomment to expose additional endpoints
# management.endpoints.web.exposure.include=health,info,metrics

