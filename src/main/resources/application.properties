spring.application.name=springtemplate
spring.profiles.default=dev
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${DB_URL:${app.database.url}}
spring.datasource.username=${DB_USERNAME:${app.database.username}}
spring.datasource.password=${DB_PASSWORD:${app.database.password}}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.mvc.hiddenmethod.filter.enabled=true
spring.data.web.pageable.max-page-size=100
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m
# Optional infrastructure is enabled only by the corresponding profile.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.roles=ADMIN
management.endpoint.health.probes.enabled=true
management.health.rabbit.enabled=false
management.health.mongo.enabled=false
management.info.env.enabled=true
info.app.name=${spring.application.name}
controller.message=${CONTROLLER_MESSAGE:Hello World}
controller.othermessage=Hello HS-KL
controller.log=Responding to a configuration example
pokeapi.pokemon.url=${POKEMON_API_URL:https://pokeapi.co/api/v2/pokemon}
app.books.base-url=${BOOKS_API_URL:http://localhost:8082}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-}] %logger{36} - %msg%n
